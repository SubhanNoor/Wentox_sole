<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Wentox ERP - Standalone Interactive Demo</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Inter (Sans) and Lora (Serif) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <!-- React & Babel -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <style>
    body {
      font-family: 'Inter', sans-serif;
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    .font-lora {
      font-family: 'Lora', serif;
    }
    /* Custom scrollbars */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
    /* Loading overlay styles */
    #__bundler_loading {
      position: fixed;
      bottom: 20px;
      right: 20px;
      font: 13px/1.4 -apple-system, BlinkMacSystemFont, sans-serif;
      color: #666;
      background: #fff;
      padding: 8px 14px;
      border-radius: 8px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.12);
      z-index: 10000;
    }
    #__bundler_thumbnail {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1B2A41;
      z-index: 9999;
      transition: opacity 0.5s ease-out;
    }
    #__bundler_thumbnail.fade-out {
      opacity: 0;
      pointer-events: none;
    }
  </style>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            navy: {
              DEFAULT: '#111c2a',
              light: '#1e2d3d',
              dark: '#0a111a',
            },
            gold: {
              DEFAULT: '#B08D57',
              light: '#c2a578',
              dark: '#937243',
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-[#f8fafc] text-slate-800 antialiased min-h-screen">

  <!-- Unpacking / Loading Animation Screen -->
  <div id="__bundler_thumbnail">
    <div class="text-center">
      <svg class="mx-auto mb-4 w-72 h-72" viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
        <rect width="1200" height="800" fill="#1B2A41"></rect>
        <rect x="470" y="300" width="260" height="260" rx="46" fill="#B08D57"></rect>
        <text x="600" y="500" font-family="Georgia,'Times New Roman',serif" font-size="200" font-weight="700" fill="#1B2A41" text-anchor="middle">S</text>
        <rect x="510" y="610" width="180" height="6" rx="3" fill="#B08D57"></rect>
      </svg>
      <div id="__bundler_loading" class="static bg-transparent shadow-none text-[#B08D57] font-semibold text-lg">Unpacking Wentox ERP...</div>
    </div>
  </div>

  <!-- React Mount Point -->
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // --- Standardized SVG Icons ---
    const Edit2 = ({ size = 15, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <path d="M12 20h9"></path>
        <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"></path>
      </svg>
    );

    const Trash2 = ({ size = 15, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <path d="M3 6h18"></path>
        <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path>
        <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path>
        <line x1="10" x2="10" y1="11" y2="17"></line>
        <line x1="14" x2="14" y1="11" y2="17"></line>
      </svg>
    );

    const Printer = ({ size = 15, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <path d="M6 9V2h12v7"></path>
        <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path>
        <rect x="6" y="14" width="12" height="8"></rect>
      </svg>
    );

    const Plus = ({ size = 15, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <path d="M5 12h14"></path>
        <path d="M12 5v14"></path>
      </svg>
    );

    const Search = ({ size = 15, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <circle cx="11" cy="11" r="8"></circle>
        <path d="m21 21-4.3-4.3"></path>
      </svg>
    );

    const ArrowLeft = ({ size = 15, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <path d="m12 19-7-7 7-7"></path>
        <path d="M19 12H5"></path>
      </svg>
    );

    const Save = ({ size = 15, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
        <polyline points="17 21 17 13 7 13 7 21"></polyline>
        <polyline points="7 3 7 8 15 8"></polyline>
      </svg>
    );

    const DollarSign = ({ size = 15, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <line x1="12" y1="1" x2="12" y2="23"></line>
        <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
      </svg>
    );

    // Format Currency Helper
    const formatCurrency = (val) => {
      return (
        <span>
          <span className="text-[#B08D57] font-bold mr-0.5">Rs</span>
          <span className="text-blue-600 font-mono font-semibold">{Number(val || 0).toLocaleString()}</span>
        </span>
      );
    };

    // Main App Component
    function App() {
      const [loading, setLoading] = useState(true);
      const [activeTab, setActiveTab] = useState('dashboard');
      const [searchQuery, setSearchQuery] = useState('');
      
      // Sub-tab states for Find & Return views
      const [findSubTab, setFindSubTab] = useState('find');
      const [returnSubTab, setReturnSubTab] = useState('find-return');

      // Edit Mode states
      const [editItem, setEditItem] = useState(null); // { type: 'city'|'customer', data: item }
      const [isFormOpen, setIsFormOpen] = useState(false);

      // Sale Return Lookup states
      const [billNoQuery, setBillNoQuery] = useState('');
      const [lookupResult, setLookupResult] = useState(null);
      const [returnItems, setReturnItems] = useState([]);
      const [invoiceDiscount, setInvoiceDiscount] = useState(0);

      // Accounts directory states
      const [selectedAccount, setSelectedAccount] = useState(null);
      const [dateStart, setDateStart] = useState('2026-07-01');
      const [dateEnd, setDateEnd] = useState('2026-07-31');

      // --- MOCK DATABASE ---
      const [cities, setCities] = useState([
        { id: 1, name: 'Lahore', badge: 'Punjab' },
        { id: 2, name: 'Karachi', badge: 'Sindh' },
        { id: 3, name: 'Rawalpindi', badge: 'Punjab' },
        { id: 4, name: 'Faisalabad', badge: 'Punjab' }
      ]);

      const [customers, setCustomers] = useState([
        { id: 101, name: 'Al-Rehman Traders', subtitle: 'Lahore' },
        { id: 102, name: 'Khyber Footwear', subtitle: 'Peshawar' },
        { id: 103, name: 'Zeeshan Shoes', subtitle: 'Faisalabad' },
        { id: 104, name: 'Bismillah Shoes', subtitle: 'Rawalpindi' },
        { id: 105, name: 'Baloch Footwear', subtitle: 'Quetta' }
      ]);

      const [bills, setBills] = useState([
        { id: '1001', customerId: 101, biltyNo: '45091', adda: 'Shalimar Transport', article: 'Art-802', gross: 45000, discount: 2000, date: '2026-07-04', items: [{ desc: 'Art-802 (Black) - Size 8', qty: 10, rate: 4500 }] },
        { id: '1002', customerId: 102, biltyNo: '78912', adda: 'Niazi Express', article: 'Art-504', gross: 68000, discount: 3000, date: '2026-07-05', items: [{ desc: 'Art-504 (Brown) - Size 9', qty: 15, rate: 4533.33 }] },
        { id: '1003', customerId: 103, biltyNo: '33104', adda: 'Faisal Moves', article: 'Art-990', gross: 120000, discount: 5000, date: '2026-07-06', items: [{ desc: 'Art-990 (White) - Size 7', qty: 24, rate: 5000 }] },
        { id: '1004', customerId: 104, biltyNo: '56122', adda: 'Bandial Transport', article: 'Art-102', gross: 34000, discount: 1000, date: '2026-07-08', items: [{ desc: 'Art-102 (Black) - Size 10', qty: 8, rate: 4250 }] }
      ]);

      const [returns, setReturns] = useState([
        { id: 'R-201', customerId: 101, biltyNo: '45091', gpNo: 'GP-098', val: 9000, date: '2026-07-07', items: [{ desc: 'Art-802 (Black) Return', qty: 2, rate: 4500 }] },
        { id: 'R-202', customerId: 103, biltyNo: '33104', gpNo: 'GP-112', val: 15000, date: '2026-07-08', items: [{ desc: 'Art-990 (White) Return', qty: 3, rate: 5000 }] }
      ]);

      const [stock, setStock] = useState([
        { article: 'Art-802', color: 'Black', cartons: 120, extraPairs: 144 },
        { article: 'Art-504', color: 'Brown', cartons: 85, extraPairs: 0 },
        { article: 'Art-990', color: 'White', cartons: 200, extraPairs: 72 },
        { article: 'Art-102', color: 'Black', cartons: 45, extraPairs: 12 }
      ]);

      const [cashTransactions, setCashTransactions] = useState([
        { id: 1, desc: 'Received from Al-Rehman Traders', type: 'Receipt', amt: 35000, date: '2026-07-05' },
        { id: 2, desc: 'Paid Transport Charges (Niazi)', type: 'Payment', amt: 4500, date: '2026-07-06' },
        { id: 3, desc: 'Received Cash Sales', type: 'Receipt', amt: 78000, date: '2026-07-07' },
        { id: 4, desc: 'Paid Office Stationery', type: 'Payment', amt: 1200, date: '2026-07-08' }
      ]);

      // Simulated initial unpacking loader
      useEffect(() => {
        const timer = setTimeout(() => {
          setLoading(false);
          const loader = document.getElementById('__bundler_thumbnail');
          if (loader) loader.classList.add('fade-out');
        }, 1200);
        return () => clearTimeout(timer);
      }, []);

      // Dynamic Bill Return Lookup
      const handleBillLookup = () => {
        const match = bills.find(b => b.id.trim() === billNoQuery.trim());
        if (match) {
          setLookupResult(match);
          setInvoiceDiscount(match.discount);
          setReturnItems(match.items.map(item => ({ ...item, qty: 1 }))); // Default to return 1 item
        } else {
          setLookupResult(null);
          alert('No invoice found for Bill Number ' + billNoQuery);
        }
      };

      // Add/Edit Submissions
      const handleSave = (e) => {
        e.preventDefault();
        if (editItem.type === 'city') {
          if (editItem.data.id) {
            setCities(cities.map(c => c.id === editItem.data.id ? editItem.data : c));
          } else {
            setCities([...cities, { ...editItem.data, id: Date.now() }]);
          }
        } else if (editItem.type === 'customer') {
          if (editItem.data.id) {
            setCustomers(customers.map(c => c.id === editItem.data.id ? editItem.data : c));
          } else {
            setCustomers([...customers, { ...editItem.data, id: Date.now() }]);
          }
        }
        setIsFormOpen(false);
      };

      // Delete triggers
      const handleDelete = (type, id) => {
        if (confirm('Are you sure you want to delete this item?')) {
          if (type === 'city') setCities(cities.filter(c => c.id !== id));
          if (type === 'customer') setCustomers(customers.filter(c => c.id !== id));
        }
      };

      // Search filters
      const filteredCities = cities.filter(c => c.name.toLowerCase().includes(searchQuery.toLowerCase()));
      const filteredCustomers = customers.filter(c => c.name.toLowerCase().includes(searchQuery.toLowerCase()));
      const filteredBills = bills.filter(b => 
        b.id.includes(searchQuery) || 
        b.biltyNo.includes(searchQuery) ||
        b.adda.toLowerCase().includes(searchQuery.toLowerCase())
      );
      const filteredReturns = returns.filter(r => 
        r.id.includes(searchQuery) || 
        r.biltyNo.includes(searchQuery) ||
        r.gpNo.includes(searchQuery)
      );

      // Ledger entries generator
      const getLedger = () => {
        if (!selectedAccount) return [];
        return [
          { date: '2026-07-01', desc: 'Opening Balance', debit: 0, credit: 0, balance: 145000 },
          { date: '2026-07-05', desc: 'Invoice #1001 Received', debit: 45000, credit: 0, balance: 190000 },
          { date: '2026-07-06', desc: 'Payment received (Cheque)', debit: 0, credit: 35000, balance: 155000 },
          { date: '2026-07-07', desc: 'Return Invoice #R-201', debit: 0, credit: 9000, balance: 146000 }
        ];
      };

      return (
        <div className="flex min-h-screen">
          
          {/* SIDEBAR NAVIGATION (Primary Navy #111c2a) */}
          <aside className="w-64 bg-navy text-slate-300 flex flex-col justify-between border-r border-navy-dark shadow-xl shrink-0">
            <div>
              {/* Branding Header */}
              <div className="p-6 border-b border-navy-light flex items-center gap-3">
                <div className="w-8 h-8 rounded-md bg-[#B08D57] flex items-center justify-center font-bold text-navy-dark">W</div>
                <div>
                  <h1 className="font-lora text-white font-semibold leading-none text-lg">Wentox ERP</h1>
                  <span className="text-[10px] text-[#B08D57] font-semibold uppercase tracking-widest mt-1 block">Sales & Admin</span>
                </div>
              </div>

              {/* Sidebar Links */}
              <nav className="p-4 space-y-1.5">
                <button 
                  onClick={() => { setActiveTab('dashboard'); setSearchQuery(''); }}
                  className={`w-full text-left px-4 py-2.5 rounded-lg text-sm font-medium transition-colors flex items-center gap-3 ${activeTab === 'dashboard' ? 'bg-[#B08D57] text-navy font-semibold' : 'hover:bg-navy-light hover:text-white'}`}
                >
                  Dashboard Overview
                </button>

                <div className="pt-4 pb-2 px-4 text-[10px] font-bold text-[#B08D57] uppercase tracking-wider">Transactions</div>
                
                <button 
                  onClick={() => { setActiveTab('find-bills'); setSearchQuery(''); }}
                  className={`w-full text-left px-4 py-2.5 rounded-lg text-sm font-medium transition-colors flex items-center gap-3 ${activeTab === 'find-bills' ? 'bg-[#B08D57] text-navy font-semibold' : 'hover:bg-navy-light hover:text-white'}`}
                >
                  Find & Update Bill
                </button>

                <button 
                  onClick={() => { setActiveTab('find-returns'); setSearchQuery(''); }}
                  className={`w-full text-left px-4 py-2.5 rounded-lg text-sm font-medium transition-colors flex items-center gap-3 ${activeTab === 'find-returns' ? 'bg-[#B08D57] text-navy font-semibold' : 'hover:bg-navy-light hover:text-white'}`}
                >
                  Find & Update Return
                </button>

                <button 
                  onClick={() => { setActiveTab('sale-return'); setSearchQuery(''); }}
                  className={`w-full text-left px-4 py-2.5 rounded-lg text-sm font-medium transition-colors flex items-center gap-3 ${activeTab === 'sale-return' ? 'bg-[#B08D57] text-navy font-semibold' : 'hover:bg-navy-light hover:text-white'}`}
                >
                  Sale Return Page
                </button>

                <div className="pt-4 pb-2 px-4 text-[10px] font-bold text-[#B08D57] uppercase tracking-wider">Setups</div>

                <button 
                  onClick={() => { setActiveTab('city-setup'); setSearchQuery(''); setIsFormOpen(false); }}
                  className={`w-full text-left px-4 py-2.5 rounded-lg text-sm font-medium transition-colors flex items-center gap-3 ${activeTab === 'city-setup' ? 'bg-[#B08D57] text-navy font-semibold' : 'hover:bg-navy-light hover:text-white'}`}
                >
                  City Setup
                </button>

                <button 
                  onClick={() => { setActiveTab('customer-setup'); setSearchQuery(''); setIsFormOpen(false); }}
                  className={`w-full text-left px-4 py-2.5 rounded-lg text-sm font-medium transition-colors flex items-center gap-3 ${activeTab === 'customer-setup' ? 'bg-[#B08D57] text-navy font-semibold' : 'hover:bg-navy-light hover:text-white'}`}
                >
                  Customer Setup
                </button>

                <div className="pt-4 pb-2 px-4 text-[10px] font-bold text-[#B08D57] uppercase tracking-wider">Reports</div>

                <button 
                  onClick={() => { setActiveTab('reports-khaata'); setSelectedAccount(null); }}
                  className={`w-full text-left px-4 py-2.5 rounded-lg text-sm font-medium transition-colors flex items-center gap-3 ${activeTab === 'reports-khaata' ? 'bg-[#B08D57] text-navy font-semibold' : 'hover:bg-navy-light hover:text-white'}`}
                >
                  Accounts Directory
                </button>

                <button 
                  onClick={() => { setActiveTab('reports-stock'); }}
                  className={`w-full text-left px-4 py-2.5 rounded-lg text-sm font-medium transition-colors flex items-center gap-3 ${activeTab === 'reports-stock' ? 'bg-[#B08D57] text-navy font-semibold' : 'hover:bg-navy-light hover:text-white'}`}
                >
                  Stock Report
                </button>

                <button 
                  onClick={() => { setActiveTab('cash-book'); }}
                  className={`w-full text-left px-4 py-2.5 rounded-lg text-sm font-medium transition-colors flex items-center gap-3 ${activeTab === 'cash-book' ? 'bg-[#B08D57] text-navy font-semibold' : 'hover:bg-navy-light hover:text-white'}`}
                >
                  Cash Book
                </button>
              </nav>
            </div>

            <div className="p-4 border-t border-navy-light text-center text-xs text-slate-500">
              Wentox v2.4 (Live Demo)
            </div>
          </aside>

          {/* MAIN PAGE CONTAINER */}
          <main className="flex-1 overflow-auto flex flex-col">
            
            {/* Top Toolbar */}
            <header className="bg-white border-b border-slate-200 h-16 flex items-center justify-between px-8 shrink-0 shadow-sm">
              <div className="flex items-center gap-3">
                <span className="font-semibold text-slate-500 uppercase text-xs tracking-wider">Active Workspace:</span>
                <span className="bg-slate-100 text-slate-700 px-3 py-1 rounded-full text-xs font-semibold border border-slate-200 shadow-sm">SubhanNoor / Wentox</span>
              </div>
              <div className="flex items-center gap-4">
                <div className="text-right">
                  <div className="text-sm font-semibold text-slate-800">Administrator</div>
                  <div className="text-[10px] font-bold text-[#B08D57] uppercase tracking-wider leading-none">Super User</div>
                </div>
                <div className="w-9 h-9 rounded-full bg-navy flex items-center justify-center text-[#B08D57] font-bold text-sm">SU</div>
              </div>
            </header>

            {/* Dynamic View Panel */}
            <div className="p-8 max-w-[1200px] w-full mx-auto flex-1">
              
              {/* --- DASHBOARD SECTION --- */}
              {activeTab === 'dashboard' && (
                <div className="space-y-8 animate-fade-in">
                  <div>
                    <h2 className="font-lora text-3xl font-semibold text-navy">Dashboard Overview</h2>
                    <p className="text-slate-400 text-xs mt-1">Real-time mock metrics and pending billing actions.</p>
                  </div>

                  {/* Summary Cards */}
                  <div className="grid grid-cols-1 md:grid-cols-4 gap-6">
                    <div className="bg-white border rounded-xl p-5 shadow-sm">
                      <div className="text-xs font-bold text-slate-400 uppercase tracking-wider">Gross Billing</div>
                      <div className="text-2xl font-bold mt-2">{formatCurrency(267000)}</div>
                      <div className="text-[10px] text-emerald-600 font-semibold mt-1">↑ 12.3% this month</div>
                    </div>
                    <div className="bg-white border rounded-xl p-5 shadow-sm">
                      <div className="text-xs font-bold text-slate-400 uppercase tracking-wider">Sale Returns</div>
                      <div className="text-2xl font-bold mt-2">{formatCurrency(24000)}</div>
                      <div className="text-[10px] text-amber-600 font-semibold mt-1">Pending approval</div>
                    </div>
                    <div className="bg-white border rounded-xl p-5 shadow-sm">
                      <div className="text-xs font-bold text-slate-400 uppercase tracking-wider">Net Revenue</div>
                      <div className="text-2xl font-bold mt-2">{formatCurrency(243000)}</div>
                      <div className="text-[10px] text-emerald-600 font-semibold mt-1">Slight growth vs target</div>
                    </div>
                    <div className="bg-white border rounded-xl p-5 shadow-sm">
                      <div className="text-xs font-bold text-slate-400 uppercase tracking-wider">Active Customers</div>
                      <div className="text-2xl font-bold mt-2 text-navy">6 Partners</div>
                      <div className="text-[10px] text-slate-500 font-semibold mt-1">Distributed across 4 cities</div>
                    </div>
                  </div>

                  {/* Recent Bills & Quick Actions */}
                  <div className="grid grid-cols-1 md:grid-cols-3 gap-8">
                    <div className="bg-white border rounded-xl p-6 shadow-sm md:col-span-2">
                      <h3 className="font-semibold text-slate-800 mb-4 text-sm uppercase tracking-wider">Recent Sales Invoices</h3>
                      <div className="overflow-x-auto">
                        <table className="w-full text-left text-sm border-collapse">
                          <thead>
                            <tr className="border-b border-slate-100 text-slate-400 text-xs font-semibold">
                              <th className="pb-3">Bill #</th>
                              <th className="pb-3">Customer</th>

                  {/* Forms overlay tab */}
                  {isFormOpen && editItem.type === 'customer' ? (
                    <div className="bg-white border rounded-xl p-6 shadow-sm space-y-6 animate-fade-in">
                      <div className="flex items-center gap-3 border-b pb-3">
                        <button onClick={() => setIsFormOpen(false)} className="p-1 rounded-full hover:bg-slate-100 text-slate-500">
                          <ArrowLeft size={16} />
                        </button>
                        <h3 className="font-semibold text-slate-800 text-sm uppercase tracking-wider">
                          {editItem.data.id ? 'Edit Customer' : 'Register Customer'}
                        </h3>
                      </div>
                      <form onSubmit={handleSave} className="space-y-4">
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                          <div>
                            <label className="text-[10px] font-bold text-slate-400 uppercase tracking-wider block mb-1">Company / Retailer Name</label>
                            <input 
                              type="text"
                              value={editItem.data.name}
                              onChange={(e) => setEditItem({ ...editItem, data: { ...editItem.data, name: e.target.value } })}
                              className="w-full bg-white border border-slate-200 rounded-lg px-4 py-2 text-sm focus:outline-none focus:border-[#B08D57]"
                              required
                            />
                          </div>
                          <div>
                            <label className="text-[10px] font-bold text-slate-400 uppercase tracking-wider block mb-1">City Location</label>
                            <input 
                              type="text"
                              value={editItem.data.subtitle}
                              onChange={(e) => setEditItem({ ...editItem, data: { ...editItem.data, subtitle: e.target.value } })}
                              className="w-full bg-white border border-slate-200 rounded-lg px-4 py-2 text-sm focus:outline-none focus:border-[#B08D57]"
                              required
                            />
                          </div>
                        </div>
                        <div className="flex justify-end gap-3 pt-3">
                          <button 
                            type="button"
                            onClick={() => setIsFormOpen(false)}
                            className="px-4 py-2 rounded border border-slate-200 text-slate-500 font-semibold text-xs uppercase tracking-wider hover:bg-slate-50"
                          >
                            Cancel
                          </button>
                          <button 
                            type="submit"
                            className="px-6 py-2 rounded bg-navy text-[#B08D57] font-semibold text-xs uppercase tracking-wider hover:bg-navy-light"
                          >
                            Save Details
                          </button>
                        </div>
                      </form>
                    </div>
                  ) : (
                    <>
                      {/* Search controls */}
                      <div className="relative">
                        <span className="absolute inset-y-0 left-3 flex items-center text-slate-400">
                          <Search size={16} />
                        </span>
                        <input 
                          type="text" 
                          placeholder="Search customers..."
                          value={searchQuery}
                          onChange={(e) => setSearchQuery(e.target.value)}
                          className="w-full bg-white border border-slate-200 rounded-lg pl-10 pr-4 py-2 text-sm focus:outline-none focus:border-[#B08D57] shadow-sm"
                        />
                      </div>

                      {/* Card Grid Layout */}
                      <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                        {filteredCustomers.map(cust => (
                          <div 
                            key={cust.id}
                            className="bg-white border rounded-xl p-5 hover:border-amber-500 hover:-translate-y-1 hover:shadow-lg transition-all duration-300 flex flex-col justify-between group cursor-pointer"
                          >
                            <div>
                              <div className="flex items-center justify-between mb-3.5">
                                <span className="text-[11px] font-bold px-2 py-0.5 rounded bg-slate-100 text-slate-600 border border-slate-200 uppercase tracking-wider">
                                  ID: {cust.id}
                                </span>
                                <span className="text-[10px] font-bold text-[#B08D57] uppercase tracking-wider">
                                  {cust.subtitle}
                                </span>
                              </div>

                              <div className="flex items-start gap-3 mb-4">
                                <div className="w-10 h-10 rounded-lg flex items-center justify-center font-bold text-sm bg-slate-50 text-slate-600 group-hover:bg-[#111c2a] group-hover:text-[#B08D57] transition-all duration-300 flex-shrink-0">
                                  {cust.name.charAt(0)}
                                </div>
                                <div className="flex-1 min-w-0">
                                  <h4 className="font-semibold text-slate-900 group-hover:text-amber-800 transition-colors leading-tight text-[15px] truncate">
                                    {cust.name}
                                  </h4>
                                  <p className="text-[11px] text-slate-400 font-medium mt-0.5 uppercase tracking-wider">
                                    Retail Partner Account
                                  </p>
                                </div>
                              </div>
                            </div>

                            {/* Card Footer: Standardized buttons */}
                            <div className="border-t pt-3 mt-1 flex items-center justify-end gap-3" onClick={(e) => e.stopPropagation()}>
                              <button 
                                onClick={() => { setEditItem({ type: 'customer', data: cust }); setIsFormOpen(true); }}
                                className="p-1.5 rounded hover:bg-slate-100 text-slate-500 hover:text-[#B08D57] transition-colors"
                                title="Edit Details"
                              >
                                <Edit2 size={15} />
                              </button>
                              <button 
                                onClick={() => handleDelete('customer', cust.id)}
                                className="p-1.5 rounded hover:bg-slate-100 text-slate-400 hover:text-red-600 transition-colors"
                                title="Delete Item"
                              >
                                <Trash2 size={15} />
                              </button>
                            </div>
                          </div>
                        ))}
                      </div>
                    </>
                  )}
                </div>
              )}

              {/* --- ACCOUNTS DIRECTORY (ReportKhaataPage Layout) --- */}
              {activeTab === 'reports-khaata' && (
                <div className="space-y-6">
                  {!selectedAccount ? (
                    <>
                      <div>
                        <h2 className="font-lora text-3xl font-semibold text-navy">Accounts Directory</h2>
                        <p className="text-slate-400 text-xs mt-1">Select an account card to view historical ledgers and statement drills.</p>
                      </div>

                      {/* Card Grid Layout */}
                      <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                        {customers.map(cust => (
                          <div 
                            key={cust.id}
                            onClick={() => setSelectedAccount(cust)}
                            className="bg-white border rounded-xl p-6 hover:border-[#B08D57] hover:-translate-y-1 hover:shadow-lg transition-all duration-300 flex flex-col justify-between group cursor-pointer"
                          >
                            <div>
                              <div className="flex justify-between items-center mb-4">
                                <span className="text-[10px] font-bold px-2 py-0.5 rounded bg-slate-50 text-slate-500 border border-slate-200">
                                  ACC: {cust.id}
                                </span>
                                <span className="text-xs font-bold text-[#B08D57]">{cust.subtitle}</span>
                              </div>
                              <h3 className="font-semibold text-slate-800 group-hover:text-amber-800 transition-colors text-[16px] mb-2">{cust.name}</h3>
                              <p className="text-xs text-slate-400">Click to run statement ledgers.</p>
                            </div>
                            <div className="border-t pt-3 mt-4 text-right text-xs font-semibold text-navy group-hover:text-[#B08D57] transition-all">
                              View Ledger →
                            </div>
                          </div>
                        ))}
                      </div>
                    </>
                  ) : (
                    <div className="bg-white border rounded-xl p-8 shadow-sm space-y-6 animate-fade-in">
                      <div className="flex items-center gap-3 border-b pb-4">
                        <button onClick={() => setSelectedAccount(null)} className="p-1 rounded-full hover:bg-slate-100 text-slate-500">
                          <ArrowLeft size={16} />
                        </button>
                        <div>
                          <h3 className="font-lora text-2xl font-semibold text-navy">{selectedAccount.name}</h3>
                          <p className="text-slate-400 text-xs mt-0.5">Account Statement drills for {selectedAccount.subtitle}</p>
                        </div>
                      </div>

                      {/* Date Filters */}
                      <div className="grid grid-cols-1 md:grid-cols-3 gap-4 bg-slate-50 p-4 rounded-xl border border-slate-100">
                        <div>
                          <label className="text-[10px] font-bold text-slate-400 uppercase tracking-wider block mb-1">Start Date</label>
                          <input type="date" value={dateStart} onChange={(e) => setDateStart(e.target.value)} className="w-full bg-white border border-slate-200 rounded px-2.5 py-1 text-sm focus:outline-none" />
                        </div>
                        <div>
                          <label className="text-[10px] font-bold text-slate-400 uppercase tracking-wider block mb-1">End Date</label>
                          <input type="date" value={dateEnd} onChange={(e) => setDateEnd(e.target.value)} className="w-full bg-white border border-slate-200 rounded px-2.5 py-1 text-sm focus:outline-none" />
                        </div>
                        <div className="flex items-end">
                          <button className="w-full py-1.5 rounded bg-navy text-[#B08D57] font-semibold text-xs uppercase tracking-wider hover:bg-navy-light transition-all">
                            Filter Ledger
                          </button>
                        </div>
                      </div>

                      {/* Ledger Table */}
                      <div className="border rounded-lg overflow-hidden">
                        <table className="w-full text-left text-sm">
                          <thead className="bg-slate-50 text-slate-500 font-semibold text-xs uppercase tracking-wider">
                            <tr>
                              <th className="p-3">Date</th>
                              <th className="p-3">Description</th>
                              <th className="p-3 text-right">Debit</th>
                              <th className="p-3 text-right">Credit</th>
                              <th className="p-3 text-right">Balance</th>
                            </tr>
                          </thead>
                          <tbody>
                            {getLedger().map((entry, idx) => (
                              <tr key={idx} className="border-t hover:bg-slate-50/30">
                                <td className="p-3 font-mono text-slate-500">{entry.date}</td>
                                <td className="p-3 font-semibold text-slate-700">{entry.desc}</td>
                                <td className="p-3 text-right font-mono">{entry.debit > 0 ? formatCurrency(entry.debit) : '-'}</td>
                                <td className="p-3 text-right font-mono">{entry.credit > 0 ? formatCurrency(entry.credit) : '-'}</td>
                                <td className="p-3 text-right font-mono font-bold text-navy">{formatCurrency(entry.balance)}</td>
                              </tr>
                            ))}
                          </tbody>
                        </table>
                      </div>
                    </div>
                  )}
                </div>
              )}

              {/* --- STOCK REPORT VIEW --- */}
              {activeTab === 'reports-stock' && (
                <div className="space-y-6">
                  <div>
                    <h2 className="font-lora text-3xl font-semibold text-navy">Stock Ledger Report</h2>
                    <p className="text-slate-400 text-xs mt-1">Available warehouse inventory by color, cartons, and extra pairs.</p>
                  </div>

                  <div className="bg-white border rounded-xl shadow-sm overflow-hidden">
                    <table className="w-full text-left border-collapse text-sm">
                      <thead>
                        <tr className="bg-slate-50/70 border-b border-slate-200 text-slate-500 font-semibold text-xs uppercase tracking-wider">
                          <th className="p-3.5 pl-6">Article Code</th>
                          <th className="p-3.5">Color Details</th>
                          <th className="p-3.5 text-center">Cartons</th>
                          <th className="p-3.5 text-center">Extra Pairs</th>
                          <th className="p-3.5 text-right pr-6">Status</th>
                        </tr>
                      </thead>
                      <tbody>
                        {stock.map((item, idx) => (
                          <tr key={idx} className="border-b border-slate-100 last:border-0 hover:bg-slate-50/40 transition-colors">
                            <td className="p-3.5 pl-6 font-mono font-bold text-slate-700">{item.article}</td>
                            <td className="p-3.5 font-semibold text-slate-800">{item.color}</td>
                            <td className="p-3.5 text-center font-mono font-bold text-slate-700">{item.cartons}</td>
                            <td className="p-3.5 text-center font-mono text-slate-500">{item.extraPairs}</td>
                            <td className="p-3.5 text-right pr-6">
                              <span className="bg-emerald-50 text-emerald-700 border border-emerald-100 px-2.5 py-0.5 rounded text-[10px] font-bold uppercase tracking-wider">
                                In Stock
                              </span>
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              )}

              {/* --- CASH BOOK VIEW --- */}
              {activeTab === 'cash-book' && (
                <div className="space-y-6">
                  <div>
                    <h2 className="font-lora text-3xl font-semibold text-navy">Daily Cash Book</h2>
                    <p className="text-slate-400 text-xs mt-1">Track daily receipts and payments from local office transactions.</p>
                  </div>

                  <div className="bg-white border rounded-xl shadow-sm overflow-hidden">
                    <table className="w-full text-left border-collapse text-sm">
                      <thead>
                        <tr className="bg-slate-50/70 border-b border-slate-200 text-slate-500 font-semibold text-xs uppercase tracking-wider">
                          <th className="p-3.5 pl-6">Date</th>
                          <th className="p-3.5">Description</th>
                          <th className="p-3.5">Type</th>
                          <th className="p-3.5 text-right pr-6">Amount</th>
                        </tr>
                      </thead>
                      <tbody>
                        {cashTransactions.map(trans => (
                          <tr key={trans.id} className="border-b border-slate-100 last:border-0 hover:bg-slate-50/40 transition-colors">
                            <td className="p-3.5 pl-6 font-mono text-slate-500">{trans.date}</td>
                            <td className="p-3.5 font-semibold text-slate-800">{trans.desc}</td>
                            <td className="p-3.5">
                              <span className={`px-2.5 py-0.5 rounded text-[10px] font-bold uppercase tracking-wider ${trans.type === 'Receipt' ? 'bg-emerald-50 text-emerald-700 border border-emerald-100' : 'bg-rose-50 text-rose-700 border border-rose-100'}`}>
                                {trans.type}
                              </span>
                            </td>
                            <td className="p-3.5 text-right pr-6 font-mono font-bold text-slate-700">{formatCurrency(trans.amt)}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              )}

            </div>
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
